name: Bug report
description: Something broke, crashed, or behaved strangely.
labels: [alpha-feedback, bug]
body:
  - type: input
    id: version
    attributes:
      label: Geometry Check version
      description: Shown next to the panel title, e.g. v0.4.0. Filled in for you from the panel's "Report on GitHub" link.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS / Windows
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Detect only, Experimental fixes]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small sketch that shows it is gold. Screenshots welcome; please don't attach confidential designs.
